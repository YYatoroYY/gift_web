<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一张记录旅行足迹与回忆的交互式地图。" />
  <title>precious memory | Travel Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="#map" aria-label="precious memory 首页">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>precious memory</span>
      </a>
      <div class="topbar-meta">
        <span>2023 - 2026</span>
        <span class="status-dot"></span>
        <span>08 cities</span>
      </div>
      <button class="menu-button" type="button" aria-label="打开地点列表" aria-expanded="false">
        <span></span><span></span>
      </button>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">PRECIOUS MEMORY</p>
          <h1 id="page-title">期待一起走遍<br /><em>每一处坐标。</em></h1>
          <p class="intro-copy">把每一次出发都在期待下一次出发。</p>
        </div>
        <div class="mascot" aria-hidden="true">
          <svg viewBox="0 0 420 340" role="img" aria-label="线条小狗马尔济斯插画">
            <g fill="none" stroke="#241d19" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M115 150c12-32 42-54 77-54 34 0 64 20 77 50"/>
              <path d="M136 128c-22 2-37 18-39 41"/>
              <path d="M283 128c22 2 37 18 39 41"/>
              <ellipse cx="210" cy="186" rx="84" ry="70"/>
              <path d="M154 202c-7 23 2 44 18 60"/>
              <path d="M266 202c7 23-2 44-18 60"/>
              <path d="M180 253c6 13 21 21 33 21 13 0 28-7 34-20"/>
              <circle cx="186" cy="184" r="7" fill="#241d19" stroke="none"/>
              <circle cx="234" cy="184" r="7" fill="#241d19" stroke="none"/>
              <path d="M205 203c4 4 6 6 10 6 4 0 6-2 10-6"/>
              <path d="M214 212c-2 5-5 8-10 10"/>
            </g>
            <circle cx="118" cy="101" r="10" fill="#ffd9e3"/>
            <circle cx="301" cy="101" r="10" fill="#ffd9e3"/>
            <circle cx="95" cy="228" r="10" fill="#fff1b8"/>
            <circle cx="318" cy="230" r="10" fill="#fff1b8"/>
          </svg>
        </div>
      </section>

      <section class="map-section" id="map" aria-label="旅行足迹地图">
        <div class="map-toolbar">
          <p><span class="pulse-key"></span>已留下足迹的城市</p>
          <p class="map-count">08 / 08</p>
        </div>
        <div class="map-wrap" id="mapWrap">
          <div class="world-map" id="worldMap" aria-label="带有旅行城市坐标的世界地图"></div>
          <div class="map-hint">点击发光坐标<br />打开一段记忆</div>
        </div>
      </section>

      <section class="trip-list" id="tripList" aria-label="城市列表"></section>
    </main>

    <footer>
      <span>THE ATLAS OF TOGETHERNESS</span>
      <span>SCROLL TO EXPLORE</span>
    </footer>
  </div>

  <aside class="story-panel" id="storyPanel" aria-hidden="true" aria-labelledby="storyTitle">
    <button class="close-button" id="closePanel" type="button" aria-label="关闭城市照片">&#215;</button>
    <div class="panel-content">
      <p class="eyebrow" id="storyIndex">01 / 08</p>
      <h2 id="storyTitle"></h2>
      <p class="story-date" id="storyDate"></p>
      <p class="story-copy" id="storyCopy"></p>
      <div class="gallery" id="gallery"></div>
    </div>
  </aside>
  <div class="panel-backdrop" id="panelBackdrop"></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="script.js"></script>
</body>
</html>
