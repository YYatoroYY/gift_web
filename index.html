<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一张记录旅行足迹与回忆的交互式地图。" />
  <title>precious memory | Travel Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="#map" aria-label="precious memory 首页">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>precious memory</span>
      </a>
      <div class="topbar-meta">
        <span>2023 - 2026</span>
        <span class="status-dot"></span>
        <span>08 cities</span>
      </div>
      <button class="menu-button" type="button" aria-label="打开地点列表" aria-expanded="false">
        <span></span><span></span>
      </button>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">PRECIOUS MEMORY</p>
          <h1 id="page-title">期待一起走遍<br /><em>每一处坐标。</em></h1>
          <p class="intro-copy">把每一次出发都在期待下一次出发。</p>
        </div>
        <div class="mascot" aria-hidden="true">
          <svg viewBox="0 0 460 340" role="img" aria-label="原创马尔济斯与金色小狗旅行插画">
            <path d="M61 233c0-86 67-154 151-154s151 68 151 154" fill="#fff2bf" opacity=".75"/>
            <g fill="none" stroke="#30251f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">

              <path d="M106 160c-25 8-34 31-29 53"/>
              <path d="M217 160c25 8 34 31 29 53"/>
              <path d="M113 144c12-25 27-37 50-37 23 0 39 12 50 37"/>
              <circle cx="140" cy="203" r="5" fill="#30251f"/>

              <path d="M156 219c4 4 8 6 13 6 5 0 9-2 13-6"/>
              <path d="M169 227c-1 4-5 8-10 10"/>
              <path d="M239 219c0-44 30-77 73-77 42 0 72 32 72 77v30c0 32-27 58-61 58h-22c-34 0-62-26-62-58z" fill="#f6c97a"/>
              <path d="M250 175c-7-33 6-60 29-69 7 22 5 40-3 55" fill="#efb765"/>
              <path d="M348 107c23 9 36 36 29 69-8-15-10-33-3-55" fill="#efb765"/>
              <circle cx="288" cy="223" r="5" fill="#30251f"/>
              <circle cx="332" cy="223" r="5" fill="#30251f"/>
              <path d="M304 239c4 4 8 6 13 6 5 0 9-2 13-6"/>
              <path d="M317 247c-1 4-5 8-10 10"/>
              <path d="M197 281c26 14 47 16 70 0"/>
              <path d="M231 270l8 11 9-11"/>
            </g>
            <path d="M182 120c8-18 20-28 35-28 15 0 27 10 35 28" fill="none" stroke="#e49aae" stroke-width="7" stroke-linecap="round"/>
            <circle cx="67" cy="126" r="11" fill="#ffd8e4"/>
            <circle cx="400" cy="122" r="11" fill="#ffd8e4"/>
            <circle cx="69" cy="278" r="11" fill="#fff0a9"/>
            <circle cx="398" cy="275" r="11" fill="#fff0a9"/>
            <path d="M218 55l5 11 12 2-9 8 2 12-10-6-11 6 3-12-10-8 13-2z" fill="#fff0a9"/>
          </svg>
        </div>
      </section>

      <section class="map-section" id="map" aria-label="旅行足迹地图">
        <div class="map-toolbar">
          <p><span class="pulse-key"></span>已留下足迹的城市</p>
          <p class="map-count">08 / 08</p>
        </div>
        <div class="map-wrap" id="mapWrap">
          <div class="world-map" id="worldMap" aria-label="带有旅行城市坐标的世界地图"></div>
          <div class="map-hint">点击发光坐标<br />打开一段记忆</div>
        </div>
      </section>

      <section class="trip-list" id="tripList" aria-label="城市列表"></section>
    </main>

    <footer>
      <span>THE ATLAS OF TOGETHERNESS</span>
      <span>SCROLL TO EXPLORE</span>
    </footer>
  </div>

  <aside class="story-panel" id="storyPanel" aria-hidden="true" aria-labelledby="storyTitle">
    <button class="close-button" id="closePanel" type="button" aria-label="关闭城市照片">&#215;</button>
    <div class="panel-content">
      <p class="eyebrow" id="storyIndex">01 / 08</p>
      <h2 id="storyTitle"></h2>
      <p class="story-date" id="storyDate"></p>
      <p class="story-copy" id="storyCopy"></p>
      <div class="gallery" id="gallery"></div>
    </div>
  </aside>
  <div class="panel-backdrop" id="panelBackdrop"></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="script.js"></script>
</body>
</html>
