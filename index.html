<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一张记录旅行足迹与回忆的交互式地图。" />
  <title>precious memory | Travel Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="#map" aria-label="precious memory 首页">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>precious memory</span>
      </a>
      <div class="topbar-meta">
        <span>2023 - 2026</span>
        <span class="status-dot"></span>
        <span>08 cities</span>
      </div>
      <button class="menu-button" type="button" aria-label="打开地点列表" aria-expanded="false">
        <span></span><span></span>
      </button>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">TRAVEL MEMORY ATLAS</p>
        <h1 id="page-title">期待一起走遍<br /><em>每一处坐标。</em></h1>
        <p class="intro-copy">把每一次出发都在期待下一次出发。</p>
      </section>

      <section class="map-section" id="map" aria-label="旅行足迹地图">
        <div class="map-toolbar">
          <p><span class="pulse-key"></span>已留下足迹的城市</p>
          <p class="map-count">08 / 08</p>
        </div>
        <div class="map-wrap" id="mapWrap">
          <div class="world-map" id="worldMap" aria-label="带有旅行城市坐标的世界地图"></div>
          <div class="map-hint">点击发光坐标<br />打开一段记忆</div>
        </div>
      </section>

      <section class="trip-list" id="tripList" aria-label="城市列表"></section>
    </main>

    <footer>
      <span>THE ATLAS OF TOGETHERNESS</span>
      <span>SCROLL TO EXPLORE</span>
    </footer>
  </div>

  <aside class="story-panel" id="storyPanel" aria-hidden="true" aria-labelledby="storyTitle">
    <button class="close-button" id="closePanel" type="button" aria-label="关闭城市照片">&#215;</button>
    <div class="panel-content">
      <p class="eyebrow" id="storyIndex">01 / 08</p>
      <h2 id="storyTitle"></h2>
      <p class="story-date" id="storyDate"></p>
      <p class="story-copy" id="storyCopy"></p>
      <div class="gallery" id="gallery"></div>
    </div>
  </aside>
  <div class="panel-backdrop" id="panelBackdrop"></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="script.js"></script>
</body>
</html>
